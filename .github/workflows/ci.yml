name: Orbix CI

on:
  push:
    branches: ['rebuild/orbix-next']
  workflow_dispatch:

concurrency:
  group: orbix-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Typecheck all packages
        run: bun run typecheck
      - name: Shared tests
        run: cd shared && bun test --max-concurrency=1 --parallel=1
      - name: Hub tests
        run: cd hub && bun test --max-concurrency=1 --parallel=1
      - name: CLI provider and transport tests
        run: cd cli && bun run tools:unpack && bunx vitest run --maxWorkers=2
      - name: Web tests
        run: cd web && bunx vitest run --maxWorkers=2
      - name: Website typecheck
        run: cd website && bun run check
      - name: Public distribution link audit
        run: bun run scripts/check-public-distribution.ts
      - name: Build production PWA
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build:web
      - name: Build website and documentation
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build:site
      - name: Upload production PWA
        uses: actions/upload-artifact@v4
        with:
          name: orbix-web
          path: web/dist
          retention-days: 14
